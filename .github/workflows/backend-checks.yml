name: Project checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**', 'integration/**', 'review/**']
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/hall_of_faze_build_only
